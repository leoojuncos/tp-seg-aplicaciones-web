name: Review automática

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Review #{0} · {1}', inputs.pr, inputs.origin) || github.event_name == 'schedule' && 'Nightly queue' || format('Labels #{0} · {1}', github.event.pull_request.number, github.event.action) }}"

on:
  pull_request_target:
    types: [labeled, synchronize]
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      origin:
        description: Who requested the review
        required: true
        default: manual
        type: choice
        options: [manual, nightly, review-now]

permissions: {}

env:
  REVIEW_NOW_CAP: 2
  JIRA_URL: https://frba-team-zh8igc5a.atlassian.net
  JIRA_PROJECT: TPS
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

jobs:
  labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: labels-${{ github.event.pull_request.number }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/review/review.mjs labels
        env:
          GITHUB_TOKEN: ${{ github.token }}

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/review/review.mjs nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}

  review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: review
    concurrency:
      group: review-${{ inputs.pr }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: node .github/review/review.mjs review --pr "$PR" --origin "$ORIGIN"
        env:
          PR: ${{ inputs.pr }}
          ORIGIN: ${{ inputs.origin }}
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - if: failure() || cancelled()
        run: node .github/review/review.mjs failure --pr "$PR"
        env:
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
