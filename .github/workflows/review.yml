name: Review automática

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Review #{0} · {1}', inputs.pr, inputs.origen) || github.event_name == 'schedule' && 'Cola de la noche' || format('Etiquetas #{0} · {1}', github.event.pull_request.number, github.event.action) }}"

on:
  pull_request_target:
    types: [labeled, synchronize]
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Número del PR
        required: true
        type: string
      origen:
        description: Quién pidió la review
        required: true
        default: manual
        type: choice
        options: [manual, nocturna, review-now]

permissions: {}

env:
  REVIEW_NOW_TOPE: 2
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

jobs:
  etiquetas:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: etiquetas-${{ github.event.pull_request.number }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/review/review.mjs etiquetas
        env:
          GITHUB_TOKEN: ${{ github.token }}

  nocturna:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/review/review.mjs nocturna
        env:
          GITHUB_TOKEN: ${{ github.token }}

  revisar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: review
    concurrency:
      group: revisar-${{ inputs.pr }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/review
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: node .github/review/review.mjs revisar --pr "$PR" --origen "$ORIGEN"
        env:
          PR: ${{ inputs.pr }}
          ORIGEN: ${{ inputs.origen }}
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure() || cancelled()
        run: node .github/review/review.mjs fallo --pr "$PR"
        env:
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
